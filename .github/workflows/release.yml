name: Release

on:
  pull_request:
    types: [closed]
    branches: [origin]

permissions:
  contents: write

jobs:
  version:
    if: github.event.pull_request.merged == true && !contains(github.event.pull_request.labels.*.name, 'no_deploy')
    runs-on: ubuntu-latest
    outputs:
      bump: ${{ steps.bump.outputs.bump }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version bump from labels
        id: bump
        env:
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          echo "PR labels: $LABELS"
          BUMP=""
          if echo "$LABELS" | grep -qi '"breaking change"'; then
            BUMP="major"
          elif echo "$LABELS" | grep -qi '"feature"'; then
            BUMP="minor"
          elif echo "$LABELS" | grep -qiE '"fix"|"hotfix"'; then
            BUMP="patch"
          fi
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          if [ -z "$BUMP" ]; then
            echo "No release-relevant label (breaking change, feature, fix, hotfix) on this PR. Skipping release."
          fi

      - name: Compute next version
        if: steps.bump.outputs.bump != ''
        id: version
        run: |
          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$LATEST_TAG" ]; then
            NEW_TAG="v0.1.0"
          else
            VERSION=${LATEST_TAG#v}
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            PATCH=$(echo "$VERSION" | cut -d. -f3)
            case "${{ steps.bump.outputs.bump }}" in
              major) NEW_TAG="v$((MAJOR + 1)).0.0" ;;
              minor) NEW_TAG="v${MAJOR}.$((MINOR + 1)).0" ;;
              patch) NEW_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
            esac
          fi
          echo "Latest tag: ${LATEST_TAG:-none}"
          echo "New tag: $NEW_TAG"
          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.bump != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: rt-linux-x86_64
          - os: macos-latest
            asset_name: rt-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ make xorg libxext-dev libbsd-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: xcode-select --install 2>/dev/null || true

      - name: Build release binary
        run: make release

      - name: Package binary and scenes
        run: |
          PKG_DIR="${{ matrix.asset_name }}"
          mkdir -p "$PKG_DIR"
          cp rt "$PKG_DIR/"
          cp -R scenes "$PKG_DIR/"
          tar -czf "${{ matrix.asset_name }}.tar.gz" "$PKG_DIR"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}.tar.gz

  release:
    needs: [version, build]
    if: needs.version.outputs.bump != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ needs.version.outputs.tag }}" -m "Release ${{ needs.version.outputs.tag }}"
          git push origin "${{ needs.version.outputs.tag }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.version.outputs.tag }}" \
            --title "${{ needs.version.outputs.tag }}" \
            --generate-notes \
            artifacts/*.tar.gz
