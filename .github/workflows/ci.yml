name: CI

on:
  push:
    branches: [origin]
  pull_request:
    branches: [origin]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ make xorg libxext-dev libbsd-dev

      - name: Build
        run: make

      - name: fclean (sanity check)
        run: make fclean
