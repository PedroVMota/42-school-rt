name: CI

on:
  pull_request:
    branches: [origin]
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

jobs:
  build:
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'no_deploy')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ make xorg libxext-dev libbsd-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: xcode-select --install 2>/dev/null || true

      - name: Build
        run: make

      - name: fclean (sanity check)
        run: make fclean
